name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-frontend:
    name: Deploy Frontend to S3
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build site
        run: |
          cd web
          npm ci
          npm run build

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Sync site to S3
        run: |
          BUCKET=s3://finance.sulaksono.id
          # 1. Scripts and styles first. Astro names them by content hash, so a
          #    name never points at different bytes: cache them for a year.
          #    Never --delete here: a page CloudFront or a browser still holds
          #    may name last deploy's assets for a few minutes after the
          #    invalidation, and old ones cost ~100KB a deploy to keep.
          aws s3 sync web/dist/_astro/ "$BUCKET/_astro/" \
            --cache-control "public, max-age=31536000, immutable"
          # 2. Pages and the rest, now that every asset they name exists.
          #    no-cache = store it, but revalidate before reuse: a page's name
          #    never changes, so a browser must always ask for the newest one.
          #    --delete also clears the old frontend's files (app.js, styles.css…).
          aws s3 sync web/dist/ "$BUCKET/" \
            --delete \
            --exclude "_astro/*" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront
        # Distribution ID for finance.sulaksono.id. Inlined as a literal (not a
        # variable) to avoid GitHub Actions injection surface. ListDistributions
        # is intentionally not used: it can't be granted per-distribution, so the
        # CI user is scoped only to cloudfront:CreateInvalidation on this ARN.
        run: |
          aws cloudfront create-invalidation \
            --region us-east-1 \
            --distribution-id E3FUF9L36MKNR \
            --paths "/*"

  deploy-backend:
    name: Deploy Backend Lambda
    runs-on: ubuntu-latest
    needs: []
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install & Zip
        run: |
          cd backend
          npm ci
          zip -r ../function.zip .

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Update Lambda
        run: |
          aws lambda update-function-code \
            --function-name ihsg-adl-api \
            --zip-file fileb://function.zip
